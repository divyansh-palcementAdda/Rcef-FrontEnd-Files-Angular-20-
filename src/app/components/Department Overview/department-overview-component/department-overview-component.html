<div class="department-overview-container py-4">

  <!-- Back Button -->
  <div class="d-flex align-items-center gap-2 mb-4">
    <button class="btn btn-secondary">
      <i class="bi bi-arrow-left me-1"></i>Back
    </button>
  </div>

  <!-- Summary Cards -->
  <div class="summary-cards-grid mb-4">
    <!-- Card 1 -->
    <div class="summary-card">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex align-items-center gap-3 p-3">
          <div class="rounded-3 p-2 flex-shrink-0" style="background: #e8f0fe;">
            <i class="bi bi-building fs-4" style="color: #3d6fd4;"></i>
          </div>
          <div>
            <div class="text-muted small">Total Departments</div>
            <div class="fw-bold fs-5" style="color: var(--text-main);">0</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="summary-card">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex align-items-center gap-3 p-3">
          <div class="rounded-3 p-2 flex-shrink-0" style="background: #e6f9f0;">
            <i class="bi bi-diagram-3-fill fs-4" style="color: #1db06a;"></i>
          </div>
          <div>
            <div class="text-muted small">Sub-Departments</div>
            <div class="fw-bold fs-5" style="color: var(--text-main);">0</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="summary-card">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex align-items-center gap-3 p-3">
          <div class="rounded-3 p-2 flex-shrink-0" style="background: #fef3c7;">
            <i class="bi bi-people-fill fs-4" style="color: #d97706;"></i>
          </div>
          <div>
            <div class="text-muted small">Total Employees</div>
            <div class="fw-bold fs-5" style="color: var(--text-main);">0</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Card 4 -->
    <div class="summary-card">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex align-items-center gap-3 p-3">
          <div class="rounded-3 p-2 flex-shrink-0" style="background: #fce7f3;">
            <i class="bi bi-clipboard-data-fill fs-4" style="color: #db2777;"></i>
          </div>
          <div>
            <div class="text-muted small">Active Tasks</div>
            <div class="fw-bold fs-5" style="color: var(--text-main);">0</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Table Section -->
  <div class="table-section">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h5 class="fw-bold mb-4" style="color: var(--text-main);">
          <i class="bi bi-table me-2 text-primary"></i>Department Details
        </h5>
        
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th style="width: 50px;">S.No</th>
                <th>Department Name</th>
                <th>Code</th>
                <th>Status</th>
                <th>Description</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="text-muted fw-semibold">1</td>
                <td class="fw-bold" style="color: var(--text-main);">Sample Department</td>
                <td><span class="badge bg-light text-dark fw-semibold">DEPT001</span></td>
                <td>
                  <span class="badge rounded-pill status-active">ACTIVE</span>
                </td>
                <td class="text-muted"><small>Sample description text</small></td>
                <td class="text-end">
                  <div class="row-actions">
                    <button class="action-icon-btn" title="View">
                      <i class="bi bi-eye"></i>
                    </button>
                    <button class="action-icon-btn" title="Edit">
                      <i class="bi bi-pencil-square"></i>
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

</div>
