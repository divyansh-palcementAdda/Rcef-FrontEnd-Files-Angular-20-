<div class="access-denied-container d-flex align-items-center justify-content-center min-vh-100 px-4">
  <div class="glass-card text-center p-5 max-w-md animate-fade-in">
    <!-- Shield Icon Container with pulses -->
    <div class="icon-pulse-wrapper mb-4 mx-auto">
      <div class="pulse-ring ring-1"></div>
      <div class="pulse-ring ring-2"></div>
      <div class="icon-circle d-flex align-items-center justify-content-center">
        <i class="bi bi-shield-lock-fill text-danger fs-1"></i>
      </div>
    </div>

    <!-- Headers -->
    <h1 class="display-6 fw-bold tracking-tight text-white mb-2">403 Forbidden</h1>
    <h2 class="h5 fw-medium text-white-50 mb-4">Access Denied</h2>

    <!-- Informative Text -->
    <p class="text-white-50 mb-5 fs-6 leading-relaxed">
      You do not have the required permissions to view this resource. 
      If you believe this is an error, please contact your systems administrator or reporting manager.
    </p>

    <!-- Action Buttons -->
    <div class="d-flex flex-column gap-3">
      <button (click)="goHome()" class="btn btn-primary btn-lg rounded-pill px-5 py-3 fw-semibold shadow-sm transition-all hover-translate-y d-flex align-items-center justify-content-center gap-2">
        <i class="bi bi-house-door-fill"></i>
        Return to Dashboard
      </button>
      <a href="mailto:admin@areyoureporting.com?subject=RCEF%20Access%20Request" class="btn btn-link text-white-50 text-decoration-none hover-text-white transition">
        <i class="bi bi-envelope-fill me-2"></i>
        Contact Support
      </a>
    </div>
  </div>
</div>
