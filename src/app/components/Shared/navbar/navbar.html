<nav class="glass-navbar fixed-top shadow-sm">
  <div class="container d-flex justify-content-between align-items-center">

    <!-- Brand -->
    <a class="navbar-brand d-flex align-items-center" routerLink="/" (click)="closeMenu()">
      <div class="brand-logo-container">
        <img
          src="assets/images/logo.png"
          alt="AreYouReporting Logo"
          class="brand-logo-img">
      </div>
      <span class="gradient-text">AreYouReporting</span>
    </a>

    <!-- Mobile toggle -->
    <button class="menu-toggle d-lg-none" (click)="toggleMenu()">
      <i class="bi" [ngClass]="isMenuOpen ? 'bi-x-lg' : 'bi-list'"></i>
    </button>

    <!-- Nav Links (desktop + mobile) -->
    <ul class="nav-links d-lg-flex" [ngClass]="{ 'active': isMenuOpen }">

      <!-- Home -->
      <li><a style="cursor:pointer" (click)="onHomeClick()">Home</a></li>
      <!-- Auth -->
      <li *ngIf="!(isLoggedIn$ | async)">
        <a routerLink="/login" (click)="closeMenu()">Login</a>
      </li>

      <li *ngIf="isLoggedIn$ | async">
        <a href="#" (click)="logout(); closeMenu()">Logout</a>
      </li>

      <!-- ***** NOTIFICATION BELL ***** -->
      <li *ngIf="(isLoggedIn$ | async) && !(isLoginPage$ | async)" class="d-flex align-items-center">
        <app-notification-bell></app-notification-bell>
      </li>
    </ul>
  </div>
</nav>

<app-toast-container></app-toast-container>
