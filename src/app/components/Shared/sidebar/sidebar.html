<aside class="sidebar-wrapper" [class.collapsed]="isCollapsed">
  <!-- Top brand area -->
  <div class="sidebar-brand d-flex align-items-center justify-content-between p-4">
    <div class="brand-info d-flex align-items-center gap-2" *ngIf="!isCollapsed">
      <div class="brand-logo-circle d-flex align-items-center justify-content-center">
        <i class="bi bi-rocket-takeoff-fill text-white fs-5"></i>
      </div>
      <span class="brand-text fw-bold tracking-tight">AreYouReporting</span>
    </div>
    <button class="collapse-toggle-btn border-0 bg-transparent text-secondary" (click)="toggleCollapse()">
      <i class="bi" [ngClass]="isCollapsed ? 'bi-chevron-right' : 'bi-chevron-left'"></i>
    </button>
  </div>

  <!-- Navigation menu -->
  <div class="sidebar-nav-container">
    <ul class="nav flex-column gap-1 px-3">
      <ng-container *ngFor="let link of links">

        <!-- Group item (e.g. Settings) -->
        <li class="nav-item" *ngIf="link.isGroup">
          <button class="nav-link d-flex align-items-center rounded-3 transition w-100 border-0 bg-transparent settings-group-btn"
                  [class.active-parent]="isSettingsActive()"
                  (click)="toggleSettings()">
            <i class="bi {{ link.icon }} fs-5"></i>
            <span class="link-label ms-3 flex-grow-1 text-start" *ngIf="!isCollapsed">{{ link.label }}</span>
            <i class="bi bi-chevron-down settings-chevron ms-auto" *ngIf="!isCollapsed"
               [class.rotated]="settingsOpen"></i>
          </button>

          <!-- Children submenu -->
          <ul class="nav flex-column settings-submenu" [class.open]="settingsOpen" *ngIf="!isCollapsed">
            <li class="nav-item" *ngFor="let child of link.children">
              <a class="nav-link d-flex align-items-center rounded-3 transition ps-4"
                 [class.active]="isLinkActive(child)"
                 [routerLink]="child.route"
                 [queryParams]="child.queryParams"
                 (click)="onLinkClick(child)">
                <i class="bi {{ child.icon }} fs-6"></i>
                <span class="link-label ms-3">{{ child.label }}</span>
              </a>
            </li>
          </ul>

          <!-- Collapsed: show children icons only as tooltip items -->
          <ul class="nav flex-column gap-1" *ngIf="isCollapsed">
            <li class="nav-item" *ngFor="let child of link.children">
              <a class="nav-link d-flex align-items-center justify-content-center rounded-3 transition"
                 [class.active]="isLinkActive(child)"
                 [routerLink]="child.route"
                 [queryParams]="child.queryParams"
                 (click)="onLinkClick(child)"
                 [title]="child.label">
                <i class="bi {{ child.icon }} fs-5"></i>
              </a>
            </li>
          </ul>
        </li>

        <!-- Regular link item -->
        <li class="nav-item" *ngIf="!link.isGroup">
          <a class="nav-link d-flex align-items-center rounded-3 transition" 
             [class.active]="isLinkActive(link)"
             [routerLink]="link.route" 
             [queryParams]="link.queryParams"
             (click)="onLinkClick(link)">
            <i class="bi {{ link.icon }} fs-5"></i>
            <span class="link-label ms-3" *ngIf="!isCollapsed">{{ link.label }}</span>
          </a>
        </li>

      </ng-container>
    </ul>
  </div>

  <!-- User profile footer -->
  <div class="sidebar-footer p-3 border-top mt-auto">
    <div class="d-flex align-items-center justify-content-between gap-2" *ngIf="!isCollapsed">
      <div class="d-flex align-items-center gap-2 min-w-0">
        <div class="user-avatar-circle d-flex align-items-center justify-content-center fw-bold">
          {{ (fullName || 'U').substring(0,1).toUpperCase() }}
        </div>
        <div class="user-info min-w-0">
          <h6 class="mb-0 fw-semibold text-truncate">{{ fullName }}</h6>
          <small class="text-muted text-truncate d-block small">{{ role }}</small>
        </div>
      </div>
      <button class="logout-btn border-0 bg-transparent text-muted" (click)="logout()" title="Logout">
        <i class="bi bi-box-arrow-right fs-5"></i>
      </button>
    </div>
    <div class="text-center" *ngIf="isCollapsed">
      <button class="logout-btn border-0 bg-transparent text-muted" (click)="logout()" title="Logout">
        <i class="bi bi-box-arrow-right fs-5"></i>
      </button>
    </div>
  </div>
</aside>
