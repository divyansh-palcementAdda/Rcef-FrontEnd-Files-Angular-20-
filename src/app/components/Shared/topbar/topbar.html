<header class="topbar-wrapper">
  <!-- Left greeting section -->
  <div class="topbar-left">
    <!-- Hamburger button visible on tablet only -->
    <button class="hamburger-btn border-0 bg-transparent text-secondary d-none d-md-flex d-xl-none p-1 align-items-center justify-content-center" (click)="toggleSidebar()" aria-label="Toggle Sidebar">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
    </button>
    <div class="d-flex flex-column greeting-container">
      <span class="greeting-text fw-semibold text-main">{{ isSmallScreen() ? (getShortGreeting() + ', ' + getShortName()) : (getGreetingTime() + ', ' + fullName) }}</span>
      <small class="text-muted text-xs">{{ currentDate | date: 'fullDate' }}</small>
    </div>
  </div>

  <!-- Right actions section -->
  <div class="topbar-right">
    <!-- Notifications Bell Component -->
    <div class="topbar-action-item">
      <app-notification-bell></app-notification-bell>
    </div>

    <!-- Divider -->
    <div class="vertical-divider"></div>

    <!-- User context profile button -->
    <div class="topbar-profile d-flex align-items-center gap-2">
      <div class="user-avatar fw-bold d-flex align-items-center justify-content-center">
        {{ (fullName || 'U').substring(0,1).toUpperCase() }}
      </div>
      <div class="user-details d-none d-md-flex flex-column">
        <span class="user-name fw-medium text-main text-sm">{{ fullName }}</span>
        <span class="user-role text-muted text-xs">{{ role }}</span>
      </div>
    </div>
  </div>
</header>
