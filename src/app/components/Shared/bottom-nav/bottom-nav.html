<nav class="bottom-nav-container">
  <div class="bottom-nav-capsule">
    <!-- Primary Links -->
    <a *ngFor="let link of primaryLinks" 
       [routerLink]="link.route" 
       [queryParams]="link.queryParams"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{exact: link.route === '/admin' || link.route === '/hod' || link.route === '/teacher'}"
       class="bottom-nav-item">
      <span class="bottom-nav-icon">
        <ng-container [ngSwitch]="link.icon">
          <!-- Dashboard -->
          <svg *ngSwitchCase="'dashboard'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-layout-dashboard"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="10" rx="1"/><rect width="7" height="5" x="3" y="15" rx="1"/></svg>
          
          <!-- Tasks -->
          <svg *ngSwitchCase="'tasks'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check-square"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 12 2 2 4-4"/></svg>
          
          <!-- Users -->
          <svg *ngSwitchCase="'users'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-users"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          
          <!-- Departments -->
          <svg *ngSwitchCase="'departments'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-building"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M8 10h.01"/><path d="M16 10h.01"/><path d="M8 14h.01"/><path d="M16 14h.01"/></svg>
          
          <!-- Hierarchy -->
          <svg *ngSwitchCase="'hierarchy'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-git-fork"><circle cx="12" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9v2c0 .6-.4 1-1 1H7c-.6 0-1-.4-1-1V9"/><path d="M12 12v3"/></svg>

          <!-- Approvals -->
          <svg *ngSwitchCase="'approvals'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-git-pull-request"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" x2="6" y1="9" y2="21"/></svg>
        </ng-container>
      </span>
      <span class="bottom-nav-label text-truncate">{{ link.label }}</span>
    </a>

    <!-- More Trigger -->
    <button (click)="toggleMoreSheet()" class="bottom-nav-item more-trigger border-0 bg-transparent" [class.active]="isMoreOpen">
      <span class="bottom-nav-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-more-horizontal"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </span>
      <span class="bottom-nav-label">More</span>
    </button>
  </div>
</nav>

<!-- Backdrop overlay with blur effect -->
<div class="bottom-sheet-backdrop" *ngIf="isMoreOpen" (click)="closeMoreSheet()"></div>

<!-- Bottom Sheet modal -->
<div class="bottom-sheet" [class.open]="isMoreOpen">
  <div class="bottom-sheet-handle-container" (click)="closeMoreSheet()">
    <div class="bottom-sheet-handle"></div>
  </div>
  
  <div class="bottom-sheet-header px-4 py-3 border-bottom d-flex align-items-center justify-content-between">
    <h5 class="mb-0 fw-semibold text-main">More Options</h5>
    <button class="close-btn border-0 bg-transparent text-secondary p-1" (click)="closeMoreSheet()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
    </button>
  </div>

  <!-- Scrollable links list -->
  <div class="bottom-sheet-body">
    <div class="more-links-grid px-3 py-2">
      <a *ngFor="let link of moreLinks"
         [routerLink]="link.route"
         [queryParams]="link.queryParams"
         routerLinkActive="active"
         (click)="closeMoreSheet()"
         class="sheet-link-item d-flex align-items-center gap-3 p-3 rounded-3 transition text-decoration-none">
        <span class="sheet-link-icon">
          <ng-container [ngSwitch]="link.icon">
            <!-- Approvals -->
            <svg *ngSwitchCase="'approvals'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-git-pull-request"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" x2="6" y1="9" y2="21"/></svg>
            
            <!-- Tasks / Self tasks -->
            <svg *ngSwitchCase="'tasks'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check-square"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 12 2 2 4-4"/></svg>

            <!-- Add Task -->
            <svg *ngSwitchCase="'add-task'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus-circle"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
            
            <!-- Add User -->
            <svg *ngSwitchCase="'add-user'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-plus"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
            
            <!-- Add Department -->
            <svg *ngSwitchCase="'add-department'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-folder-plus"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/><line x1="12" x2="12" y1="10" y2="16"/><line x1="9" x2="15" y1="13" y2="13"/></svg>
            
            <!-- Sub-Departments -->
            <svg *ngSwitchCase="'sub-departments'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-grid"><rect width="18" height="18" x="3" y="3" rx="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="3" x2="21" y1="15" y2="15"/><line x1="9" x2="9" y1="3" y2="21"/><line x1="15" x2="15" y1="3" y2="21"/></svg>
            
            <!-- Recurring Tasks -->
            <svg *ngSwitchCase="'recurring'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-refresh-cw"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
            
            <!-- Task Templates -->
            <svg *ngSwitchCase="'templates'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-text"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
            
            <!-- Roles & Permissions -->
            <svg *ngSwitchCase="'permissions'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-alert"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.8 17 5 19 5a1 1 0 0 1 1-1Z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
          </ng-container>
        </span>
        <span class="sheet-link-label text-main">{{ link.label }}</span>
      </a>
    </div>
  </div>

  <!-- Pinned user profile footer -->
  <div class="bottom-sheet-footer p-3 border-top bg-light mt-auto">
    <div class="d-flex align-items-center justify-content-between gap-3">
      <div class="d-flex align-items-center gap-3 min-w-0">
        <div class="sheet-avatar d-flex align-items-center justify-content-center fw-bold text-white">
          {{ (fullName || 'U').substring(0,1).toUpperCase() }}
        </div>
        <div class="sheet-user-info min-w-0">
          <h6 class="mb-0 fw-semibold text-truncate text-main">{{ fullName }}</h6>
          <small class="text-muted text-truncate d-block text-xs">{{ role }}</small>
        </div>
      </div>
      <button class="sheet-logout-btn btn btn-outline-danger d-flex align-items-center gap-2 py-2" (click)="logout()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-log-out"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
        <span>Logout</span>
      </button>
    </div>
  </div>
</div>
