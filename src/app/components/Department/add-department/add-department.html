<div [class.container]="!isModal" [class.py-4]="!isModal" [class.modal-form-layout]="isModal">
  <div [class.dept-form-card]="!isModal" [class.modal-form-card]="isModal">
    
    <!-- Form Header -->
    <div [class.dept-form-header]="!isModal" [class.text-center]="!isModal" [class.modal-form-header]="isModal">
      <div>
        <h3 class="mb-2 fw-bold" style="color: var(--text-main);">{{ departmentId ? 'Edit Department' : 'Add Department' }}</h3>
        <p class="mb-0 text-muted small">Manage organizational structure</p>
      </div>
      <button *ngIf="isModal" type="button" class="modal-close-btn-inline" (click)="cancel()" aria-label="Close">
        <i class="bi bi-x-lg fs-5"></i>
      </button>
    </div>

    <!-- Form Body -->
    <div [class.dept-form-body]="!isModal" [class.modal-form-body]="isModal">
      
      <!-- Alerts -->
      <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show mb-4 animate__animated animate__fadeIn">
        <span><i class="bi bi-check-circle-fill me-2"></i>{{ successMessage }}</span>
        <button type="button" class="btn-close" (click)="successMessage = null" aria-label="Close"></button>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show mb-4 animate__animated animate__fadeIn">
        <span><i class="bi bi-exclamation-triangle-fill me-2"></i>{{ errorMessage }}</span>
        <button type="button" class="btn-close" (click)="errorMessage = null" aria-label="Close"></button>
      </div>

      <!-- Form -->
      <form [formGroup]="departmentForm" (ngSubmit)="onSubmit()" novalidate>
        
        <!-- Department Name -->
        <div class="mb-4">
          <label class="form-label">Department Name <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-building"></i></span>
            <input type="text" class="form-control" formControlName="name" placeholder="e.g. Department of Computer Science">
          </div>
          <div *ngIf="departmentForm.get('name')?.touched && departmentForm.get('name')?.invalid" class="text-danger small mt-1">
            <small>Department name is required and must be between 1 and 100 characters.</small>
          </div>
        </div>

        <!-- Description -->
        <div class="mb-4">
          <label class="form-label">Description</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-chat-dots"></i></span>
            <textarea class="form-control" rows="4" formControlName="description" placeholder="Enter department scope and details..."></textarea>
          </div>
          <div *ngIf="departmentForm.get('description')?.touched && departmentForm.get('description')?.invalid" class="text-danger small mt-1">
            <small>Description cannot exceed 500 characters.</small>
          </div>
        </div>

        <!-- Submit actions -->
        <div [class.d-flex]="true" [class.justify-content-end]="true" [class.gap-2]="true" [class.mt-5]="!isModal" [class.pt-3]="!isModal" [class.border-top]="!isModal" [class.modal-form-footer]="isModal">
          <button type="button" class="btn btn-secondary px-4" (click)="cancel()">Cancel</button>
          <button type="submit" class="btn btn-primary px-5" [disabled]="isSubmitting || departmentForm.invalid">
            <span *ngIf="!isSubmitting">{{ departmentId ? 'Save Changes' : 'Add Department' }}</span>
            <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm" role="status"></span>
          </button>
        </div>

      </form>
    </div>

  </div>
</div>
